spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_learning?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
      timeout: 3000ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartlearning.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 9090

jwt:
  secret: ${JWT_SECRET:smart-learning-system-jwt-secret-key-2026}
  expiration: ${JWT_EXPIRATION:86400000}

cache:
  knowledge-graph-ttl: 3600
  recommendation-ttl: 1800
  course-list-ttl: 600

rate-limit:
  login-per-minute: 10
  record-per-minute: 30
  default-per-minute: 60
